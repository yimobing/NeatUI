        <script>

            
            var coordinate = $('#s-coordinate').val();
            var coorArr = coordinate.split(',');
            var lng = coorArr.length > 0 ? coorArr[0] : '',
                lat = coorArr.length > 1 ? coorArr[1] : '';
            console.log('lng：', lng, ',lat：', lat)
            // 百度地图API功能
            var map = new BMap.Map("allmap");
            var point = new BMap.Point(lng, lat);
            map.centerAndZoom(point, 12);

            // 查询按钮
            $('#btn-query').on('click', function(){
                var city = $('#s-city').val(),
                    address = $('#s-address').val();
                console.log('地址：', address);

                // 使用地理编码。配额足够，1天最多5000次
                var myGeo = new BMap.Geocoder(); // 创建地理编码、地址解析器实例
                // 对指定的地址进行解析：将地址解析结果显示在地图上,并调整地图视野
                myGeo.getPoint(address, function(point){
                    console.log('point：', point)
                    if (point) {
                        // 解析成功：返回坐标
                        map.centerAndZoom(point, 16);
                        map.addOverlay(new BMap.Marker(point));
                    }else{
                        // 解析失败
                        alert("您选择地址没有解析到结果!");
                    }
                }, city);   
            });



            //————————————————————————————————————————————————
            /**
             * [封装函数] 获取位置坐标：使用地理编码服务
             * 说明：
             * 1、返回值只有坐标、没有地址、电话、邮编等信息
             * 2、配额足够，1天最多5000次
             * @param {String} address 位置名称、地点名称
             * @param {String} city 指定城市
             * @param {Function} callback 回调函数。参数格式：{"point类型的坐标"}
             */
            function getAddressCoordinateByGeoCoder(address, city, callback){
                var geo = new BMap.Geocoder(); // 创建地理编码实例
                // 对指定的地址进行解析
                geo.getPoint(address, function(point) {
                    if (point) {
                        // 解析成功：返回坐标
                        callback(point);
                    } else {
                        // 解析失败
                        callback(null);
                    }
                }, city);
            }
