        //——————————————————————————————————————————
        /**
         * 兼容ie和旧版edge的方案
         * 替代原生closest的兼容方法
         * @param {HTMLElement} el 起始元素（如e.target）
         * @param {String} selector 匹配选择器（类、id、标签都支持）
         * @returns {HTMLElement|null} 匹配到的元素或null
         */
         function getClosest(el, selector) {
            var currentEl = el;
            // 向上遍历直到根节点
            while (currentEl) {
                // 判断当前元素是否匹配选择器
                if (currentEl.matches ? currentEl.matches(selector) : currentEl.msMatchesSelector(selector)) {
                 return currentEl;
                }   
                // 向上找父元素
                currentEl = currentEl.parentElement;
            }
            return null;
        }

        /**

        function format_data_of_last_time_search(ps_dataSource) {
            var defaultSource = { data: [] }
            if(typeof ps_dataSource.data == 'undefined') return defaultSource;
            if(ps_dataSource.data.length == 0) return defaultSource;
            var newSource = {
                data: [{

                    "fenzu_mc": "",

                }]
            };
            $.each(ps_dataSource.data, function(index, item) {
                newSource.data[0].data.push(item);
            })
            return newSource;
        }

        function create_html_list_of_word(ps_dataSource, ps_opts) {

                        '</div>',
                    '</li>'
                ].join('\r\n')

        /**
         * 创建当前查询的关键字列表结构HTML (预备查询的关键字列表结构HTML)
         * @param {Array} ps_data_arr 数据源数组
         */
        function create_html_list_of_search_word(ps_data_arr) {
            var _html = '<ul>';
            $.each(ps_data_arr, function(index, item) {
                // console.log('item：', item)
                var tmp_group_mc = item["team"];
                if(tmp_group_mc.toString().replace(/\s+/g, '') !== '') tmp_group_mc += '：';
                var tmp_str = '';
                $.each(item.data, function(idx, row) {
                    var tmp_guanjianzi_mc = row["keyword"],
                        tmp_juli_mi = row["distance"];
                    tmp_str += tmp_guanjianzi_mc + '(' + tmp_juli_mi + 'm)';
                    if(idx < item.data.length - 1) tmp_str += '、';
                })
                _html += [
                    '<li>',
                        '<span>' + tmp_group_mc + '</span>',
                        '<em>' + tmp_str + '</em>',
                    '</li>'
                ].join('\r\n')
            })
            _html += '</ul>';
            $('.bds__search_prepare_list').empty().append(_html)
        }

        //                                                   初始化
        //————————————————————————————————————————————————————————————————————————————————————————————————————————————————
        //——————————————————————————————————————————
        // 查询输入框默认值
        $('#s-range').val(DEFAULT_RANGE); // 范围、半径

        //——————————————————————————————————————————
        // 根据“是否启用默认搜索组或默认搜索关键字功能”进行初始化
        if(IS_ENABLE_DEFAULT_SEARCH_WORD) { // 启用时
            // 取数
            // var defaultWordData = get_data_default_search_of_keywords(); // 获取默认搜索关键字数据
            var defaultGroupData = get_data_default_search_of_group(); // 获取默认搜索组数据
            var lastTimeWordData = format_data_of_last_time_search(get_data_last_time_search_of_keywords()); // 上次搜索关键字数据
            // 展示
            var resultGroupWordData = lastTimeWordData.data.length > 0 ? lastTimeWordData : defaultGroupData; // 如果有上次搜索关键字数据则使用之，否则使用默认搜索组数据
            // console.log('lastTimeWordData：', lastTimeWordData, '\ndefaultGroupData：', defaultGroupData, '\nresultGroupWordData：', resultGroupWordData)
            if(typeof resultGroupWordData.data == 'undefined') {
                console.error('后端JSON结构异常，已兜底\n', resultGroupWordData);
            }
            else {
                var initWordData = [];
                var targetWordListData = []; // 格式eg. [{"team": "", data: [{"keyword": "", "distance": ""}]}]
                resultGroupWordData.data.forEach(function(item){
                    var tmp_fenzu_mc = item["fenzu_mc"];
                    var one = { "team": tmp_fenzu_mc, data: []}
                    item.data.forEach(function(row) {
                        var tmp_guanjianzi_bh = row["guanjianzi_bh"],
                            tmp_zhongyao_changsuo_dai_julidizhi = row["zhongyao_changsuo_dai_julidizhi"] || '',
                            tmp_guanjianzi_mc = row["guanjianzi_mc"],
                            tmp_juli_mi = row["juli"];
                        if(typeof tmp_guanjianzi_bh == 'undefined') tmp_guanjianzi_bh = '';
                        if(typeof tmp_zhongyao_changsuo_dai_julidizhi == 'undefined') tmp_zhongyao_changsuo_dai_julidizhi = '';
                        if(isNaN(parseFloat(tmp_juli_mi))) tmp_juli_mi = DEFAULT_RANGE;
                        initWordData.push(tmp_guanjianzi_mc);
                        // 查询时附近项目输入框属性 data-word 属性值统一格式 test1
                        one.data.push({
                            "id": tmp_guanjianzi_bh,
                            "keyword": tmp_guanjianzi_mc, 
                            "distance": tmp_juli_mi,
                            "widthDistance": tmp_zhongyao_changsuo_dai_julidizhi
                        })
                    })
                    targetWordListData.push(one);
                })
                // console.log('targetWordListData：', targetWordListData)
                initWordData = utilities.uniqueArray(initWordData); // 数组去重

                // 更新 data-word 属性值
                $('#s-near').val(initWordData.join(',')).attr('data-word', JSON.stringify(targetWordListData)); // 设 data-word 属性值。附近项目输入框赋值
                // 创建当前查询的关键字列表
                create_html_list_of_search_word(targetWordListData);
                $('.bds__search_prepare').show(); // 显示列表
                $('.bds__search_prepare_title').text('预备要查询的关键字'); // 更改文字
            }
        }
        else { // 不启用
            // 统一半径复选框禁止或允许手动输入
            $('#r-radius-check').prop('checked', true); // 勾选统一半径复选框
            $('#s-range').attr('disabled', false); // 半径允许手动输入
        }

        /**
         * 获取位置坐标：使用地理编码服务
         * 说明：
         * 1、返回值只有坐标、没有地址、电话、邮编等信息
         * 2、配额足够，1天最多5000次
         * @param {String} address 位置名称、地点名称
         * @param {String} city 指定城市
         * @param {Function} callback 回调函数。参数格式：{"point类型的坐标"}
         */
        function getAddressCoordinateByGeoCoder(address, city, callback){
            var geo = new BMap.Geocoder(); // 创建地理编码实例
            // 对指定的地址进行解析
            geo.getPoint(address, function(point) {
                if (point) {
                    // 解析成功：返回坐标
                    callback(point);
                } else {
                    // 解析失败
                    callback(null);
                }
            }, city);
        }



        /**
         * 从地点字符串中提取城市名称
         * @param {String} 地点字符串。eg. '福建省-泉州市-丰泽区', '福建省-泉州市', '福建省-泉州', '泉州市', '泉州'
         * @returns {String} 返回城市名。eg. 泉州市, 泉州
         */
        function getCityName (str) {
            // 提取城市名(支持：省-市-区/单独市/城)
            var reg = /^(?:.+?-)?([^-]+?市?)(?:-.+)?$/;
            var result = str.match(reg);
            return result ? result[1] : '';
        }

        // 附近项目输入框输入事件
        $('#s-near').on('input', function(){
            var newStr = $(this).val().toString().replace(/\s+/g, '').replace(/[,:;!，：；!、。]$/g, ''), // 去掉空格、最后面的逗号等字符
                newArr = newStr.split(/[,:;!，：；！、。]/);
            var oldStr = $(this).attr('data-word'); // 取 data-word 属性值。附近项目输入框取值
            if(typeof oldStr == 'undefined') oldStr = '';
            var oldArr = oldStr.toString().replace(/\s+/g, '') == '' ? [] : JSON.parse(oldStr);
            // console.log('oldStr：', oldStr, '\noldArr：', oldArr, '\nnewArr：', newArr);

            // 实现目标：
            // 1.删除 oldArr 中 keyword 不在 newArr 的项
            // 2.跳过原始数据中已有的空分组，避免重复
            // 3.newArr 中如果关键词不存在，则补充到同一个空team里
            var resultArr = [];
            // 复制 oldArr 并过滤掉不在 newArr 里的 keyword
            for (var i = 0; i < oldArr.length; i++) {
                var oldTeam = oldArr[i];
                // 跳过原始数据中自带的空team分组，防止重复生成
                if (oldTeam.team === '') {
                    continue;
                }
                var newTeam = {
                    team: oldTeam.team,
                    data: []
                };
                for (var j = 0; j < oldTeam.data.length; j++) {
                    var item = oldTeam.data[j];
                    if (newArr.indexOf(item.keyword) !== -1) {
                        newTeam.data.push(item);
                    }
                }
                // 只保留有数据的分组
                if (newTeam.data.length > 0) {
                    resultArr.push(newTeam);
                }
            }
            // 收集 resultArr 里已有的 keyword
            var existKeywords = [];
            for (var i = 0; i < resultArr.length; i++) {
                var team = resultArr[i];
                for (var j = 0; j < team.data.length; j++) {
                    var kw = team.data[j].keyword;
                    if (existKeywords.indexOf(kw) === -1) {
                        existKeywords.push(kw);
                    }
                }
            }
            // 收集所有缺失的关键词
            var missData = [];
            for (var i = 0; i < newArr.length; i++) {
                var key = newArr[i];
                // 过滤掉空字符串关键词，避免生成 {keyword: ""}
                if (key && existKeywords.indexOf(key) === -1) {
                    // 查询时附近项目输入框属性 data-word 属性值统一格式 test1
                    missData.push({ 
                        "id": "",
                        "keyword": key, 
                        "distance": DEFAULT_RANGE,
                        "widthDistance": ""
                    });
                }
            }
            // 统一将缺失项放入同一个空分组
            if (missData.length > 0) {
                resultArr.push({
                    team: "",
                    data: missData
                });
            }
            // console.log("新数据 newArr：", newArr);
            // console.log("原数组 oldArr（未改动）：", oldArr);
            // console.log("处理后 resultArr：", resultArr);

            // 更新 data-word 属性值
            $(this).attr('data-word', JSON.stringify(resultArr)); // 设 data-word 属性值。附近项目输入框赋值 
        });

        /**
         * 字符串匹配删除（兼容 IE9+）
         * 支持“精准整词匹配、模糊匹配”两种模式
         * @param {String} oldStr 原始字符串
         * @param {String} keyword 要删除的关键词
         * @param {Boolean} isExact 是否精准匹配。true=精准匹配（只删完整词），false=模糊匹配（删所有包含的）
         * @returns {String} 删除后的新字符串
         * @example
            原字符串："泉州第一医院x,泉州第一医院,泉州第一医院y"
            精准匹配：removeMatchWord(str,"泉州第一医院",true) → "泉州第一医院x,泉州第一医院y"
            模糊匹配：removeMatchWord(str,"泉州第一医院",false) → "x,,y"
         */
        function removeMatchWord(oldStr, keyword, isExact) {
            // 处理空值，避免报错
            if (!oldStr || !keyword) return oldStr;
            // 转义正则特殊字符，防止正则解析异常
            function escapeReg(str) {
                return str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            }
            var key = escapeReg(keyword);
            var reg;
            if (isExact === true) {
                reg = new RegExp(
                    "(^|[^\\u4e00-\\u9fa5a-zA-Z0-9])" + 
                    key + 
                    "(?=$|[^\\u4e00-\\u9fa5a-zA-Z0-9])",
                    "g"
                );
                return oldStr.replace(reg, "$1");
            } else {
                reg = new RegExp(key, "g");
                return oldStr.replace(reg, "");
            }
        }

        /**
         * [筛选查询区域] 执行筛选操作
         * @param {Array} ps_filter_district_arr 待筛选区县数组，空数组表示展示全部。格式：[{fullName:"城市区县",shortName:"区县"}]。eg. [{fullName:"泉州市丰泽区",shortName:"丰泽区"}]
         */
        function fn_done_filter(ps_filter_district_arr) {
            // console.log('区县数组：', ps_filter_district_arr);
            if(rawAllPois.length === 0){
                neuiDialog.alert({
                    animate: true,
                    message: "暂无数据，请先点击【查询按钮】加载数据",
                    buttons:['确定']
                });
                return;
            }
            $elFilterArea.slideUp(); // 隐藏二次筛选区域
            $elFilterOperateBtn.removeClass('up');

            // 展示查询关键词区县筛选区域
            var districtHtml = '';
            for(var i = 0; i < ps_filter_district_arr.length; i++) {
                var item = ps_filter_district_arr[i];
                districtHtml += [
                    '<li>' + item["allName"] + '</li>'
                ].join('\r\n')
            }
            if(districtHtml != '') {
                $('.bds__search_prepare_block.block__district').show();
                $('.bds__search_prepare_some').empty().append(districtHtml);
            }
            else {
                $('.bds__search_prepare_block.block__district').hide();
            }

            // 修复：清理冗余边界缓存，只保留本次筛选需要的区县边界，删除历史残留
            var tempCache = {};
            for(var i = 0; i < ps_filter_district_arr.length; i++){
                var sName = ps_filter_district_arr[i].shortName;
                if(boundsCache[sName]){
                    tempCache[sName] = boundsCache[sName];
                }
            }
            boundsCache = tempCache; // 覆盖全局缓存，清除无关旧区县

            // 根据取数方案进行筛选
            if(IS_USE_WEB_API){
                // 方案1 WebAPI专属逻辑：无边界逻辑，直接过滤渲染
                // console.log('aaa1');
                var filterRes = buildViewData(rawAllPois, ps_filter_district_arr);
                fnAddMarker(filterRes.allBdPointsByCate, filterRes.allBdPointsNotCate);
                fnNearComposeStringToUser(filterRes.allPois, wordArrGlobal);
                return;
            }
            
            else {
                
                // 方案2：JSAPI专属逻辑
                var boundary = new BMap.Boundary();
                var needLoadDis = [];
                for(var d = 0; d < ps_filter_district_arr.length; d++){
                    var sName = ps_filter_district_arr[d].shortName;
                    if(!boundsCache[sName]){
                        needLoadDis.push(ps_filter_district_arr[d]);
                    }
                }

                // 存在未缓存区县，异步加载边界后渲染
                if(needLoadDis.length > 0){
                    var loadCnt = 0;
                    var totalLoad = needLoadDis.length;
                    // console.log('aaa1');
                    for(var l = 0; l < needLoadDis.length; l++){
                        var disItem = needLoadDis[l];
                        boundary.get(disItem.fullName, function(rs){
                            loadCnt++;
                            var pathStr = rs.boundaries[0];
                            var pointArr = pathStr.split(";");
                            var disBounds = null;
                            for(var pIdx = 0; pIdx < pointArr.length; pIdx++){
                                var lnglatStr = pointArr[pIdx].split(",");
                                var pt = new BMap.Point(lnglatStr[0], lnglatStr[1]);
                                if(disBounds == null){
                                    disBounds = new BMap.Bounds(pt, pt);
                                }else{
                                    disBounds.extend(pt);
                                }
                            }
                            var currShort = disItem.shortName;
                            boundsCache[currShort] = disBounds;
                            if(loadCnt === totalLoad){
                                var res = buildViewData(rawAllPois, ps_filter_district_arr);
                                fnAddMarker(res.allBdPointsByCate, res.allBdPointsNotCate);
                                fnNearComposeStringToUser(res.allPois, wordArrGlobal);
                            }
                        });
                    }
                    return;
                }

                // 边界全部缓存完毕，直接渲染
                // console.log('aaa2');
                var filterRes = buildViewData(rawAllPois, ps_filter_district_arr);
                fnAddMarker(filterRes.allBdPointsByCate, filterRes.allBdPointsNotCate);
                fnNearComposeStringToUser(filterRes.allPois, wordArrGlobal);
            }
        }


        //——————————————————————————————————————————
        /**
         * =========================================
         * [筛选查询区域] 通用方法：根据原始全集 + 指定区县数组生成视图渲染数据
         * =========================================
         * @param {Array} sourceRawList 原始全量POI缓存
         * @param {Array} targetDistrictArr 指定区县数组。格式：[{fullName:"城市区县",shortName:"区县"}]。eg. [{fullName:"泉州市丰泽区",shortName:"丰泽区"}]
         */
        function buildViewData(sourceRawList, targetDistrictArr){
            var viewPois = [];
            var viewCatePoints = [];
            var viewNoCatePoints = [];
            if(!sourceRawList || sourceRawList.length === 0){
                return {allPois:viewPois, allBdPointsByCate:viewCatePoints, allBdPointsNotCate:viewNoCatePoints};
            }
            // 区分方案1 WebAPI / 方案2 JSAPI 两套过滤规则
            if(IS_USE_WEB_API){
                // 方案1：依据接口返回 qu 字段匹配区县
                for(var k = 0; k < sourceRawList.length; k++){
                    var oneItem = sourceRawList[k];
                    var newOne = {keyword:oneItem.keyword, isNeedGap:oneItem.isNeedGap, data:[]};
                    var cateGroup = {keyword:oneItem.keyword, data:[]};
                    var rawDataList = oneItem.data;
                    for(var m = 0; m < rawDataList.length; m++){
                        var poiItem = rawDataList[m];
                        var pass = false;
                        if(targetDistrictArr.length === 0){
                            pass = true; // 无区县，全部放行
                        }else{
                            // 遍历本次筛选传入的区县数组匹配 qu 字段
                            for(var n = 0; n < targetDistrictArr.length; n++){
                                var disShort = targetDistrictArr[n].shortName;
                                if(poiItem["county"] === disShort){
                                    pass = true;
                                    break;
                                }
                            }
                        }
                        if(pass){
                            newOne.data.push(poiItem);
                            cateGroup.data.push({
                                "title": poiItem.title,
                                "point": poiItem.point,
                                "address": poiItem.address,
                                "distance": poiItem.distance,
                                "phoneNumber": poiItem.phoneNumber
                            });
                            viewNoCatePoints.push(poiItem.point);
                        }
                    }
                    viewPois.push(newOne);
                    viewCatePoints.push(cateGroup);
                }
            }else{
                // 方案2：仅循环【本次传入的区县数组】，不再遍历全部缓存边界（修复核心bug）
                for(var k = 0; k < sourceRawList.length; k++){
                    var oneItem = sourceRawList[k];
                    var newOne = {keyword:oneItem.keyword, isNeedGap:oneItem.isNeedGap, data:[]};
                    var cateGroup = {keyword:oneItem.keyword, data:[]};
                    var rawDataList = oneItem.data;
                    for(var m = 0; m < rawDataList.length; m++){
                        var outcome = rawDataList[m];
                        var p = outcome.point;
                        var address = typeof outcome.address == 'undefined' ? '' : outcome.address;
                        var passFilter = false;
                        if(targetDistrictArr.length === 0){
                            passFilter = true; // 无勾选区县，不做过滤全部放行
                        }else{
                            // 只循环当前筛选传入的区县，而非全部缓存边界
                            for(var n = 0; n < targetDistrictArr.length; n++){
                                var disShortName = targetDistrictArr[n].shortName;
                                var disBounds = boundsCache[disShortName];
                                if(!disBounds) continue;
                                var pointInDis = disBounds.containsPoint(p); // 条件1：POI坐标落在区县矩形边界内
                                var addrMatch = address.indexOf(disShortName) > -1;  // 条件2：POI地址包含区县短名，兜底坐标误差
                                if(pointInDis && addrMatch){
                                    passFilter = true;
                                    break;
                                }
                            }
                        }
                        if(passFilter){
                            newOne.data.push(outcome);
                            cateGroup.data.push({
                                "title": outcome.title,
                                "point": p,
                                "address": address,
                                "distance": outcome.distance,
                                "phoneNumber": outcome.phoneNumber
                            });
                            viewNoCatePoints.push(p);
                        }
                    }
                    viewPois.push(newOne);
                    viewCatePoints.push(cateGroup);
                }
            }
            return {
                allPois: viewPois,
                allBdPointsByCate: viewCatePoints,
                allBdPointsNotCate: viewNoCatePoints
            };
        }

        /**
         * 计算两点之间的距离（Haversine公式）
         * @param {Number} lat1 - 点1纬度
         * @param {Number} lng1 - 点1经度
         * @param {Number} lat2 - 点2纬度
         * @param {Number} lng2 - 点2经度
         * @returns {Number} 返回距离（米）
         */
        function fnCalculateDistance(lat1, lng1, lat2, lng2) {
            var R = 6371000; // 地球半径（米）
            var dLat = toRad(lat2 - lat1);
            var dLng = toRad(lng2 - lng1);
            var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                    Math.sin(dLng / 2) * Math.sin(dLng / 2);
            var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            var val = R * c;
            return Math.round(val);
        };

        /**
         * 角度转弧度
         * @param {Number} degrees - 角度
         * @returns {Number} 弧度
         */
        function toRad(degrees) {
            return degrees * Math.PI / 180;
        };

                                            '<span> 距离：</span>',
                                            '<em>' + distance + '米</em>',
                                        '</div>',
                                    '</div>'
                                ].join('\r\n');
                                return _tmpHtml;
                            })(),
                            (function(){
                                var _tmpHtml = address == '' ? '' : 
                                [
                                    '<div class="result__detail">',
                                        '<div class="result__detail_one">',
                                            '<span>' + address_str + '：</span>',
                                            '<em>' + address + '</em>',
                                        '</div>',
                                    '</div>'
                                ].join('\r\n');
                                return _tmpHtml;
                            })(),
                            (function(){
                                var _tmpHtml = phoneNumber == '' || typeof phoneNumber == 'undefined' ? '' : 
                                [
                                    '<div class="result__detail">',
                                        '<div class="result__detail_one">',
                                            '<span> 电话：</span>',
                                            '<em>' + phoneNumber + '</em>',
                                        '</div>',
                                    '</div>'
                                ].join('\r\n');
                                return _tmpHtml;
                            })(),
                        '</li>'
                    ].join('\r\n')
                }
            
                // 在地图上手动打点 -> 创建详细列表4
                // 重点：新增 data-filter-trigger 通用标记，兼容任意class的后续动态列表
                detailListHtml += [
                    '<div class="result__list_group">',
                        '<div class="result__list_group_title" data-filter-cate="' + keyword + '" data-filter-trigger>' + keyword + '（' + length + '个）</div>',
                        tmpLiHtml == '' ? '' : '<ul>' + tmpLiHtml + '</ul>',
                    '</div>',
                ].join('\r\n')
            }
            // console.log('dataset：', window.filterDataSet);

            // 在地图上手动打点 -> 创建详细列表5
            detailAllHtml = [
                '<div class="result__caption"> 查询结果 </div>',
                '<div class="result__list">',
                    detailListHtml,
                '</div>'
            ].join('\r\n')
            document.getElementById(resultId_2).innerHTML = detailAllHtml;

            // 恢复地图清空功能
            // setTimeout(function () {
            //     map.clearOverlays = originalClear;
            // }, 200);

            // 自动调整视野
            if (pointNotCategorize.length > 0) {
                map.setViewport(pointNotCategorize, {
                    zoomFactor: -2 // 缩放级别减N
                });
            }

            // 点击详细列表联动：点击时只显示当前点标注
            var nodes = document.querySelectorAll("#panel-result2 li");
            for (var n = 0; n < nodes.length; n++) {
                var _node = nodes[n];
                // console.log('_node：', _node);
                _node.onclick = null;
                _node.setAttribute("data-index", n);
                _node.onclick = function () {
                    var idx = parseInt(this.getAttribute("data-index"), 10);
                    // 先隐藏所有文本标注
                    for (var k = 0; k < tempLabels.length; k++) {
                        tempLabels[k].setStyle({ display: 'none' });
                    }
                    // 只显示当前点击项的标注
                    if (tempLabels[idx]) {
                        tempLabels[idx].setStyle({ display: 'block' });
                    }
                    // 地图移动到点
                    if (tempMarkers[idx]) {
                        var point = tempMarkers[idx].getPosition();
                        if(point.lng.toString() != '0' && point.lat.toString() != '0') {
                            map.panTo(tempMarkers[idx].getPosition());
                            map.setZoom(18); // 强行缩放级别。值 3-19
                            // 显示信息窗
                            // var infoWindow = new BMap.InfoWindow(titles[idx]);
                            // map.openInfoWindow(infoWindow, tempMarkers[idx].getPosition());
                        }
                    }
                };
            }
        }



        //——————————————————————————————————————————
        /**
         * 核心筛选工具函数：切换分类点位显隐、控制标题高亮、自动适配地图视野
         * 即：坐标点根据分类进行显示，比如点学校只显示学校的那些坐标点
         * @param {String} targetCateLot 点击标题的分类标识 data-filter-cate 值，分类匹配键
         * @param {HTMLElement} clickDom 当前点击的标题DOM，用于精准切换高亮
         * 交互规则：
         * 1. 新分类：仅展示该分类点位，高亮当前标题，地图适配分类视野
         * 2. 同分类不同标题：点位不变，仅切换高亮到本次点击DOM
         * 3. 点击已高亮的同分类标题：取消筛选，恢复全部点位，清空高亮
         */
        window.handleCateFilter = function(targetCateLot, clickDom) {
            var store = window.filterDataSet; // 读取当前批次全部点位数据
            if (!store || !store.tempMarkers.length) return; // 无点位直接退出，防报错

            var currentActiveCate = window._activeFilterGroup; // 当前激活筛选分类key
            var currentActiveDom = window._activeFilterDom || null; // 当前高亮标题DOM

            // 更新全局筛选状态
            if(currentActiveCate === targetCateLot){
                if(currentActiveDom === clickDom){
                    window._activeFilterGroup = ''; window._activeFilterDom = null; // 点击自身，取消筛选
                }else{
                    window._activeFilterDom = clickDom; // 同分类其他标题，仅切换高亮
                }
            }else{
                window._activeFilterGroup = targetCateLot; window._activeFilterDom = clickDom; // 切换新分类
            }

            // 控制地图Marker、Label显隐
            var domId = clickDom.getAttribute('id'), btnId = 'btn-show-hide-coord';
            for(var m = 0; m < store.tempMarkers.length; m++){
                var tag = store.markerCateTag[m],
                    marker = store.tempMarkers[m],
                    label = store.tempLabels[m];
                if(window._activeFilterGroup === ''){
                    // console.log('aaa1');
                    marker.show(); label.setStyle({display: 'block'}); // 无筛选，全部显示
                }else if(tag === window._activeFilterGroup){
                    // console.log('aaa2');
                    marker.show(); label.setStyle({display: 'block'}); // 当前筛选分类，展示点位
                }else{
                    // console.log('aaa3'); 
                    marker.hide(); label.setStyle({display: 'none'}); // 其他分类，隐藏点位
                }
            }

            // 统一处理所有标题高亮
            var allTitles = document.querySelectorAll('[data-filter-trigger]');
            for(var t = 0; t < allTitles.length; t++){
                var tDom = allTitles[t]; utilities.removeClass(tDom, 'on');  // 清空全部高亮，全部移除选中class
            }
            if(window._activeFilterGroup !== '' && window._activeFilterDom){
                utilities.addClass(window._activeFilterDom, 'on'); // 仅高亮当前激活标题，给当前激活标题加on类
            }

            // 自动切换地图视野
            if(window._activeFilterGroup === ''){
                if (store.pointNotCategorize.length > 0) map.setViewport(store.pointNotCategorize, {zoomFactor: -2}); // 取消筛选，恢复全局视野
                // 当是“显示所有坐标点按钮”时
                if(domId == btnId) {
                    clickDom.innerText = '隐藏所有坐标点';
                }
            }else{ 
                var targetPoints = store.pointCateObj[window._activeFilterGroup];
                if(targetPoints && targetPoints.length > 0) map.setViewport(targetPoints, {zoomFactor: -2}); // 适配当前分类点位视野

                // 当是“隐藏所有坐标点按钮”时
                if(domId == btnId) {
                    clickDom.innerText = '显示所有坐标点';
                    // 视野切换到中心点
                    var coordinates = $('#c-locate').val();
                    var coordArr = coordinates.split(',');
                    var lng = coordArr.length > 0 ? coordArr[0] : '',
                        lat = coordArr.length > 1 ? coordArr[1] : '';
                    if(lng != '' && lat != '') {
                        map.setViewport({
                            center: new BMap.Point(lng, lat),
                            zoom: 17
                        });
                    }
                }
            }
        };

        /**
        * 全局事件委托：监听页面点击，兼容渲染后动态新增的列表标题
        * 无需反复绑定事件，所有带data-filter-trigger属性的标题自动触发筛选函数
        * @param {Event} e 全局点击事件对象，用于获取实际点击的DOM元素
        */
        document.addEventListener('click', function(e) {
            var triggerDom = e.target.closest('[data-filter-trigger]'); // 向上匹配筛选标题标记
            if (!triggerDom) return; // 点击非标题区域，直接终止
            var cateLot = triggerDom.getAttribute('data-filter-cate'); // 获取分类标识
            window.handleCateFilter(cateLot, triggerDom); // 调用筛选逻辑
        });




        //——————————————————————————————————————————
        /**
         * 创建“查询结果”、“保存结果”切片数据
         * 即：根据百度地图附近关键词搜索结果返回的值组成用户所需的字符串
          【说明】
          组成字符串显示在界面上：
            ①关键词是除“公交”以外的显示效果
            区域内有学校：丰泽实验小学、鲤城实难小学、东湖小学、兴光小学等；医院：东南医院、东湖医院、人民医院、第二医院等。
            ②关键词是“公交”时的显示效果
            出入可利用私家车、公交车、自行车及出租车等；周边有“幸福街口”公交站点：有1路、2路等公交线路停靠。
         * @param {Array} ps_poi_data 查询结果数据源数组。数据格式：[{keyword: "关键词", data: [{title: "名称", "address": "地址", "province": "所在省份", "city": "所在城市", "point": "坐标点对象, lng, lat", ... }]}]
         * @param {Array} ps_keyword_data 查询关键词数据源数组
         */
        function fnNearComposeStringToUser(ps_poi_data, ps_keyword_data){
            // console.log('ps_poi_data：', ps_poi_data, '\nps_keyword_data：', ps_keyword_data);
            // console.log('-----------');
            var placeList = [], // 搜索到的地点名称组成的数组。eg. ['a小学', 'b小学', 'a医院', 'b医院']
                composeArr = [], // 关键词+搜索到的地点名称组合在一起的语句组成数组。eg. ['学校：a小学、b小学等', '医院：a医院、b医院等']
                savedArr = [], // 用于保存的数组。eg. [{'title': '学校', data: ['a小学', 'b小学']}, {'title': '医院', data: ['a医院', 'b医院']}]
                busArr = [], // 公交站点数组
                busStr = ''; // 公交组成的字符串
            for(var i = 0; i < ps_poi_data.length; i++) {
                var one = ps_poi_data[i];
                var word = one.keyword,
                    pois = one.data,
                    aboutGap = one.isNeedGap;
                // console.log('word：', word)
                var oneStr = '', titleArr = [], oneSaveObj = { title: word, aboutGap: aboutGap, data: []};
                // console.log('pois:', pois)
                // console.log('len:', pois.length)
                for(var k = 0; k < pois.length; k++) {
                    var poi = pois[k]; // 不知为何，有些情况下poi会是undefined
                    // console.log('poi：', poi);
                    if(typeof poi != 'undefined') {
                        // 可选：在地图上标注POI
                        // var marker = new BMap.Marker(poi.point);
                        // map.addOverlay(marker);
                        // marker.setLabel(new BMap.Label(poi.title, {offset: new BMap.Size(20, -10)}));
                        var title = poi.title, address = poi.address, distance = poi.distance;
                        if(typeof distance == 'undefined') distance = -1; // -1 表示数据有误
                        // console.log('address：', address)
                        placeList.push(title);
                        var save_title = '';
                        if(word.indexOf('公交') >= 0) {
                            busArr.push(title);
                            busStr += '\r\n“' + title + '”公交站点：';
                            if(address != '') {
                                busStr += '有' + address.replace(/(\;|\；|、)/g, '、') + '等公交线路停靠';
                                busStr += ( k == pois.length - 1) ? '。' : '；';
                            }
                            save_title = title + '站';
                            save_title += '(' + address.replace(/(\;|\；|、)/g, '|') + ')'; // 这里用竖线分隔符|来分隔,方便保存时改成顿号。注：竖线分隔符用于分隔公交线路
                        }
                        else {
                            titleArr.push(title);
                            save_title = title;
                        }
                        oneSaveObj.data.push({
                            "name": save_title,
                            "distance": distance,
                            "address": address
                        });
                    }
                }
               
                oneStr += titleArr.join('、');
                oneStr += titleArr.length == 0 ? '' : ((i == ps_poi_data.length - 1) ? '。' : '等；\r\n\r\n'); 
                oneStr = (word.indexOf('公交') >= 0 ? '' : (titleArr.length == 0 ? word + '：\r\n\r\n' : word + '：')) + oneStr;
                composeArr.push(oneStr);
                savedArr.push(oneSaveObj);
            }

            // console.log('地点名称数组：', placeList, '\n结果组合数组：', composeArr, '\n要保存的数组：', savedArr);
            var serviceStr = '区域内有\r\n\r\n' + composeArr.join('');
            busStr = busStr == '' ? '' : ('\r\n出入可利用交通工具：\r\n出入可利用私家车、公交车、自行车及出租车等；周边有“' + busArr.join('、') + '”' + busArr.length + '个公交站点，公交线路如下：\r\n' + busStr);

            // 如果最后一个字符是分号则转化为句号
            var index = serviceStr.lastIndexOf('；'), length = serviceStr.length;
            if(index == length - 1) {
                serviceStr = serviceStr.substring(0, index) + '。';
            }

            // 创建“当前查询的关键字”列表
            create_html_list_of_search_word(ps_keyword_data);
            $('.bds__search_prepare').show(); // 显示列表
            $('.bds__search_prepare_title').text('当前查询的关键字'); // 更改文字

            // 创建“查询结果”切片数据：
            var resultStr = serviceStr + '\r\n' + busStr;
            $('#r-result').val(resultStr);

            // 创建“保存结果”切片数据
            create_html_list_of_saved({data: savedArr});
            $('#btn-save, #btn-show-hide-coord').show(); // 显示保存按钮
            $('.block__random_char').hide(); // 隐藏单号一栏
        }




        //——————————————————————————————————————————
        // 保存按钮：保存结果数据
        $('#btn-save').on('click', function(){
            var $elNode = $('.bds__search_result_outcome_switch_display');
            if($elNode.children().length == 0) {
                neuiDialog.alert({
                    message: '无数据，无需保存',
                    buttons: ['确定']
                })
                return;
            }
            var ls_xiaoqu_mingcheng = $('#s-community').val(); // 小区名称
            var ls_suiji_bh = utilities.getRandomString(18); // N位随机字符。

            neui.showAnimate();
            setTimeout(function() {

                // 数据校验。改成：在循环内只提交内容不为空的数据
                // var isPassed = true;
                // $elNode.children().each(function (){
                //     var $input = $('input:text', this);
                //     var ls_guanjianzi_ziduan = $input.attr('data-title'),
                //         ls_neirong = $input.val();
                //     if(ls_neirong.toString().replace(/\s+/g, '') == '') {
                //         isPassed = false;
                //         neui.destroyAnimate();
                //         neuiDialog.alert({
                //             message: ls_guanjianzi_ziduan + '：请输入内容或至少选择一项',
                //             buttons: ['确定']
                //         })
                //         return false;
                //     }
                // });
                // if(isPassed == false) return;

                // 开始执行
                var isContinue = true;
                $elNode.children().each(function (){
                    var $input = $('input:text', this);
                    var title = $input.attr('data-title'),
                        value = $input.val();
                    value = value.replace(/\s+/g, ' '); // 多个空格替换成1个
                    value = value.replace(/\s/g, ','); // 空格替换成逗号
                    value = value.replace(/[,:;!，：；！、。]/g, ','); // 分号等字符转成逗号
                    value = value.replace(/(,){2,}/g, ',').replace(/(.*),$/g, '$1').replace(/^,(.*)/g, '$1'); // 去掉多个逗号等符号，去掉结尾开头的逗号
                    var ls_guanjianzi_ziduan = filter.dangerousChars(title), 
                        ls_neirong = filter.dangerousChars(value);
                    // console.log('title：', title, '\nls_neirong：', ls_neirong);

                    // 更改字符串标点符号，组成用户所需的标点符号
                    var isBus = ls_guanjianzi_ziduan.indexOf('公交') >= 0 ? true : false;
                    ls_neirong = ls_neirong.replace(/(,)/g, '，').replace(/(\|)/g, '、'); // 英文逗号转成中文逗号，竖线分隔符转成顿号(竖线分隔符用于分隔公交线路)
                    if(isBus == false) { // 不是公交时，关键词之间的中文逗号改成顿号
                        ls_neirong = ls_neirong.toString().replace(/(，)/g, '、');
                    }
                  
                    // 只提交内容不为空的数据
                    if(ls_neirong.toString().replace(/\s+/g, '') !== '') {
                        var ls_data = {
                            "action": "wh_loupan_fujin_guanjianzi_sousuo_ins",
                            "user": "<%=s_user%>",
                            "sjk": "<%=s_sjk%>",
                            "menu_bh": "<%=s_menu_bh%>",
                            "suiji_bh": ls_suiji_bh,
                            "guanjianzi_ziduan": ls_guanjianzi_ziduan,
                            "neirong": ls_neirong,
                            "xiaoqu_mingcheng": ls_xiaoqu_mingcheng
                        }
                        // console.log('ls_data：', ls_data);

                        var flag = '',  // 是否成功。值： 空值表示未知, 1 是, false 否
                            msg = ''; // 失败时的信息
                        // START AJAX
                        var response = Ajax({
                            async: false, // 取数方式. true 异步(默认), false 同步
                            type: "POST",
                            dataType: "html",
                            cache: false,
                            url: "../fwh_pub/jk_loupan_fujin.ashx?param=2002",
                            data: ls_data,
                            success: function(res){
                                if(!res || $.isEmptyObject(res)) return;
                                var result = JSON.parse(res);
                                flag = result.return == 'ok' ? 1 : 0;
                                if(!flag) msg = result.data;
                            },
                            error: function(errs){ },
                            beforeSend: function(xhr){ },
                            complete: function(xhr, status){ }
                        });
                        // END AJAX

                        // 网络、HTTP错误(断网、404、500、超时等)
                        if (!response.isHttpSuccess) {
                            neui.destroyAnimate();
                            isContinue = false;
                            flag = 0;
                            msg = response.standardErr.message;
                        }

                        if(!parseInt(flag)) {
                            isContinue = false;
                            neuiDialog.alert({
                                message: msg,
                                buttons: ['确定']
                            })
                            neui.destroyAnimate();
                            return false;
                        }
                    }
                });

                if(isContinue) {
                    neuiDialog.alert({
                        message: '保存成功',
                        buttons: ['确定'],
                        callBack: function() {
                            $('.block__random_char').show(); // 显示单号一栏
                            $('#oddNumber').val(ls_suiji_bh); // 给单号一栏赋值
                        }
                    })
                }

                neui.destroyAnimate();
            }, 100);
        });



    </script>
</body>
